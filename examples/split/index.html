<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vectro split tables</title>
<style>
  :root { --ink: #1b2430; --muted: #5b6573; --line: #d9dee5; --ok: #0f766e; --bad: #b45309; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink: #e6edf3; --muted: #9aa3ae; --line: #30363d; --ok: #3fb9a8; --bad: #f0a35e; --bg: #0d1117; } }
  body { font: 15px/1.5 -apple-system, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); max-width: 920px; margin: 24px auto; padding: 0 16px; }
  table { border-collapse: collapse; width: 100%; margin: 8px 0 20px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); font-weight: 600; } .bad { color: var(--bad); font-weight: 600; } .muted { color: var(--muted); }
</style>
</head>
<body>
<h1>vectro: split tables</h1>
<p class="muted">A normal page: no cross-origin isolation headers, so no SharedArrayBuffer. Each Web Worker owns a slice of the table and only small results travel between threads.</p>
<p id="status">Running…</p>
<div id="out"></div>
<script type="module">
import { SplitEngine } from '../../src/browser.mjs';
import { Engine as SingleEngine } from '../../src/portable.mjs';

const out = document.getElementById('out'), status = document.getElementById('status');
const R = { env: {}, checks: {}, timings: [], frames: [] };
window.__results = R;
const fmt = (ms) => (ms < 1 ? `${(ms * 1000).toFixed(0)} µs` : `${ms.toFixed(1)} ms`);
const tick = () => new Promise((r) => setTimeout(r, 0));
async function best(f, reps = 5) { await f(); let m = Infinity; for (let i = 0; i < reps; i++) { const s = performance.now(); await f(); m = Math.min(m, performance.now() - s); } return m; }
const close = (a, b) => (Array.isArray(a) ? a.every((x, i) => close(x, b[i])) : Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b)));

try {
  const split = new SplitEngine();
  const single = new SingleEngine();
  R.env = { crossOriginIsolated: self.crossOriginIsolated, SharedArrayBuffer: typeof SharedArrayBuffer, workers: split.size, cores: navigator.hardwareConcurrency };
  status.textContent = 'Generating 10,000,000 rows…';
  await tick();

  const N = 10_000_000, REG = ['EU', 'US', 'APAC', 'LATAM', 'MEA', 'UK', 'CA', 'ANZ'];
  let seed = 7;
  const rnd = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
  const price = new Float64Array(N), qty = new Float64Array(N), reg = new Uint8Array(N);
  for (let i = 0; i < N; i++) { price[i] = Math.round(rnd() * 1e5) / 100; qty[i] = 1 + Math.floor(rnd() * 9); reg[i] = Math.floor(rnd() * 8); }
  const region = Array.from(reg, (r) => REG[r]);

  status.textContent = 'Loading into the workers…';
  await tick();
  let s = performance.now();
  const tP = await split.tableAsync({ price, qty, region });
  R.load = { split: performance.now() - s };
  s = performance.now();
  const tS = single.table({ price, qty, region });
  R.load.single = performance.now() - s;

  const js = {
    revenue: () => { let s = 0; for (let i = 0; i < N; i++) if (price[i] > 100 && qty[i] < 5) s += price[i] * qty[i]; return s; },
    dashboard: () => { let n = 0, s = 0, r = 0; for (let i = 0; i < N; i++) if (reg[i] === 0) { n++; s += price[i]; r += price[i] * qty[i]; } return [n, s / n, r]; },
    group: () => { const r = new Float64Array(8); for (let i = 0; i < N; i++) r[reg[i]] += price[i] * qty[i]; return REG.map((_, k) => r[k]); },
    derive: () => { const o = new Float64Array(N); for (let i = 0; i < N; i++) o[i] = price[i] * qty[i]; return o.length; },
  };
  const groupRows = (rows) => REG.map((g) => rows.find((x) => x.region === g)?.rev ?? 0);
  const Q = {
    revenue: { p: () => tP.filter('price > 100 && qty < 5').sumAsync('price * qty'), s: () => tS.filter('price > 100 && qty < 5').sum('price * qty') },
    dashboard: { p: async () => Object.values(await tP.filter("region == 'EU'").aggAsync({ n: 'count()', avg: 'mean(price)', rev: 'sum(price * qty)' })), s: () => Object.values(tS.filter("region == 'EU'").agg({ n: 'count()', avg: 'mean(price)', rev: 'sum(price * qty)' })) },
    group: { p: async () => groupRows((await tP.groupBy('region').aggAsync({ rev: 'sum(price * qty)' })).toRows()), s: () => { const g = tS.groupBy('region').agg({ rev: 'sum(price * qty)' }); const r = groupRows(g.toRows()); g.dispose(); return r; } },
    derive: { p: async () => { const d = await tP.deriveAsync('rev', 'price * qty'); const n = d.length; await d.dispose(); return n; }, s: () => { const d = tS.derive('rev', 'price * qty'); const n = d.length; d.dispose(); return n; } },
  };

  status.textContent = 'Checking answers…';
  await tick();
  for (const [name, q] of Object.entries(Q)) {
    const want = js[name]();
    R.checks[name] = close(await q.p(), want) && close(q.s(), want);
  }

  status.textContent = 'Timing…';
  await tick();
  for (const [name, q] of Object.entries(Q)) R.timings.push({ query: name, split: await best(q.p), single: await best(q.s), js: await best(js[name]) });

  async function turnsDuring(work) {
    const ch = new MessageChannel();
    let turns = 0, running = true, last = performance.now(), worst = 0;
    ch.port1.onmessage = () => { const now = performance.now(); worst = Math.max(worst, now - last); last = now; turns++; if (running) ch.port2.postMessage(0); };
    ch.port2.postMessage(0);
    const s = performance.now();
    await work();
    const ms = performance.now() - s;
    running = false;
    worst = Math.max(worst, performance.now() - last);
    ch.port1.close();
    return { ms, turns, worst };
  }
  status.textContent = 'Measuring responsiveness…';
  await tick();
  R.frames.push({ mode: `split tables, ${split.size} workers`, ...(await turnsDuring(async () => { for (let i = 0; i < 10; i++) for (const q of Object.values(Q)) await q.p(); })) });
  R.frames.push({ mode: 'sync API, 1 thread', ...(await turnsDuring(async () => { for (let i = 0; i < 10; i++) for (const q of Object.values(Q)) q.s(); })) });

  const lines = ['price,qty,region'];
  for (let i = 0; i < 2_000_000; i++) lines.push(`${price[i]},${qty[i]},${region[i]}`);
  const csv = new TextEncoder().encode(lines.join('\n'));
  let a, b;
  const csvSplit = await best(async () => { await a?.dispose(); a = await split.parseCSVAsync(csv); }, 2);
  const csvSingle = await best(async () => { b?.dispose(); b = single.parseCSV(csv); }, 2);
  R.csv = { mb: csv.length / 1e6, split: csvSplit, single: csvSingle, same: a.length === b.length && close(await a.sumAsync('price'), b.sum('price')) };

  const ok = (v) => `<span class="${v ? 'ok' : 'bad'}">${v ? 'yes' : 'NO'}</span>`;
  out.innerHTML = `
    <table><tr><th>Environment</th><th></th></tr>
      <tr><td>crossOriginIsolated</td><td>${R.env.crossOriginIsolated}</td></tr>
      <tr><td>SharedArrayBuffer</td><td>${R.env.SharedArrayBuffer}</td></tr>
      <tr><td>Web Workers, each owning a slice</td><td>${R.env.workers}</td></tr></table>
    <table><tr><th>10M rows</th><th class="n">split, ${R.env.workers} workers</th><th class="n">1 thread</th><th class="n">plain JS loop</th><th>correct</th></tr>
      ${R.timings.map((t) => `<tr><td>${t.query}</td><td class="n">${fmt(t.split)}</td><td class="n">${fmt(t.single)}</td><td class="n">${fmt(t.js)}</td><td>${ok(R.checks[t.query])}</td></tr>`).join('')}
      <tr><td>load 10M rows from JS arrays</td><td class="n">${fmt(R.load.split)}</td><td class="n">${fmt(R.load.single)}</td><td class="n">–</td><td></td></tr>
      <tr><td>parse CSV (${R.csv.mb.toFixed(0)} MB, 2M rows)</td><td class="n">${fmt(R.csv.split)}</td><td class="n">${fmt(R.csv.single)}</td><td class="n">–</td><td>${ok(R.csv.same)}</td></tr></table>
    <table><tr><th>40 heavy queries</th><th class="n">time</th><th class="n">page got a turn</th><th class="n">longest wait for the page</th></tr>
      ${R.frames.map((f) => `<tr><td>${f.mode}</td><td class="n">${fmt(f.ms)}</td><td class="n">${f.turns.toLocaleString()} times</td><td class="n">${fmt(f.worst)}</td></tr>`).join('')}</table>`;
  status.textContent = 'Done.';
} catch (err) {
  R.error = String(err?.stack ?? err);
  out.innerHTML = `<pre class="bad">${R.error}</pre>`;
  status.textContent = 'Failed.';
}
R.done = true;
R.userAgent = navigator.userAgent;
const reportName = new URLSearchParams(location.search).get('report');
if (reportName) fetch(`/report?name=${encodeURIComponent(reportName)}`, { method: 'POST', body: JSON.stringify(R) });
</script>
</body>
</html>
